name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  slint-production-build-and-test:
    # Compiles generated .slint C++, links the production appliance frontend,
    # and runs the renderer-independent Slint adapter suite. Rendering tests
    # remain intentionally separate from this dependency/build gate.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Cache pinned Slint FetchContent checkout and build
        uses: actions/cache@v4
        with:
          path: |
            build/slint/_deps
          key: slint-1.19.0-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake', 'ui/slint/**') }}
      - name: Configure production Slint build
        run: nix develop --no-update-lock-file --command cmake --preset slint
      - name: Compile generated components and production executable
        run: nix develop --no-update-lock-file --command cmake --build --preset slint
      - name: Run Slint-enabled CTest suite
        run: nix develop --no-update-lock-file --command ctest --preset slint
      - name: Retain rendered Slint diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slint-rendered-failure-artifacts
          path: build/slint/slint-*.ppm*
          if-no-files-found: warn
          retention-days: 7

  nix-build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Check locked flake
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Build package
        run: nix build --no-update-lock-file --print-build-logs
      - name: Headless device-enumeration smoke test
        run: nix run --no-update-lock-file . -- --headless --list-devices
      - name: Configure sanitizer build
        run: nix develop --no-update-lock-file --command cmake --preset sanitize
      - name: Build with ASan and UBSan
        run: nix develop --no-update-lock-file --command cmake --build --preset sanitize
      - name: Test with ASan and UBSan
        run: nix develop --no-update-lock-file --command ctest --preset sanitize

  aarch64-native-build-and-test:
    # GitHub's hosted Arm64 runner provides native compilation and host tests.
    # It does not provide physical audio or MIDI hardware verification.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Check locked AArch64 flake outputs
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Build native AArch64 package
        run: nix build --no-update-lock-file .#packages.aarch64-linux.default --print-build-logs
      - name: Native AArch64 headless smoke test
        run: nix run --no-update-lock-file .#apps.aarch64-linux.default -- --headless --list-devices
